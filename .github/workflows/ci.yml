name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Verify golangci-lint config
        run: golangci-lint config verify
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

  test-min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/forgejo-mcp

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: docs/TOOLS.md is up to date
        run: go run ./internal/tools/docgen -check

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

  integration:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Start Forgejo and create the test token
        run: |
          bash test/integration/bootstrap.sh | grep '^export ' > "$RUNNER_TEMP/it.env"
          # the token is masked in the log before it is exported to later steps
          . "$RUNNER_TEMP/it.env"
          echo "::add-mask::$FORGEJO_TEST_TOKEN"
          cat "$RUNNER_TEMP/it.env" | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Integration tests
        env:
          FORGEJO_TEST_RUNNER: "1"
        run: go test ./test/integration -count=1
      - name: Endpoint index is current
        run: |
          make endpoints SWAGGER="$FORGEJO_TEST_URL/swagger.v1.json" VER=17.0.2
          git diff --exit-code internal/endpoints/index.json
      - name: Collect container logs
        if: failure()
        run: docker compose -f test/integration/docker-compose.yml logs > "$RUNNER_TEMP/forgejo-logs.txt" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: forgejo-logs
          path: ${{ runner.temp }}/forgejo-logs.txt
      - name: Teardown
        if: always()
        run: bash test/integration/teardown.sh
