version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - noctx
    - nolintlint
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      - linters:
          - errcheck
        text: "Close|os.Remove"
      - path: _test\.go
        linters:
          - errcheck
          - usestdlibvars
          - noctx
formatters:
  enable:
    - gofumpt
    - goimports
