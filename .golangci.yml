version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - noctx
    - nolintlint
    - unconvert
    - usestdlibvars
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
        text: "Close"
formatters:
  enable:
    - gofumpt
    - goimports
